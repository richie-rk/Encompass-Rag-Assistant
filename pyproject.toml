[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "encompass-rag-assistant"
version = "0.1.0"
description = "A sophisticated Retrieval-Augmented Generation (RAG) system for querying Encompass API documentation with natural language"
readme = "README.md"
license = "MIT"
authors = [
    {name = "richie-rk", email = "your.email@example.com"}
]
keywords = ["rag", "llm", "encompass", "api", "documentation", "retrieval", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.72",
    "langchain-huggingface>=0.3.1",
    "langchain-ollama>=0.3.6",
    "langchain-text-splitters>=0.3.9",
    "langchain-google-genai>=0.0.11",
    "faiss-cpu>=1.11.0",
    "sentence-transformers>=5.0.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.47.1",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "torch>=2.7.1",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "scikit-learn>=1.7.1",
    "ollama>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
gpu = [
    "faiss-gpu>=1.7.4",
]
all = [
    "encompass-rag-assistant[dev,gpu]",
]

[project.urls]
Homepage = "https://github.com/richie-rk/encompass-rag-assistant"
Repository = "https://github.com/richie-rk/encompass-rag-assistant"
Issues = "https://github.com/richie-rk/encompass-rag-assistant/issues"

[project.scripts]
encompass-rag = "rag_docs.rag_app:main"

[tool.hatch.build.targets.wheel]
packages = ["rag_docs/src/rag_docs"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true